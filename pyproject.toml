[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane-kit-secrets"
version = "0.1.0"
description = "Durable secret provider for Control Plane Kit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpenJ92" }
]
dependencies = [
  "cryptography==50.0.0",
  "control-plane-kit-core @ https://github.com/OpenJ92/control-plane-kit/archive/e074bda49fa0c46f420d675e45a93f787b460c02.zip#subdirectory=control-plane-kit-core",
  "control-plane-kit-server-sdk[fastapi] @ https://github.com/OpenJ92/control-plane-kit-server-sdk/archive/d8b72e52c8ebca65bf21a2a2ae51df663b1c8a77.zip",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28",
  "uvicorn>=0.35",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_plane_kit_secrets = ["py.typed"]
