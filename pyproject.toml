[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane-kit-secrets"
version = "0.1.0"
description = "Durable secret provider for Control Plane Kit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpenJ92" }
]
dependencies = [
  "cryptography==50.0.0",
  "control-plane-kit-core @ https://github.com/OpenJ92/control-plane-kit/archive/6b2d173bccbab9f8cb4fa4c35fef60d2ca27aa0e.zip#subdirectory=control-plane-kit-core",
  "control-plane-kit-server-sdk[fastapi] @ https://github.com/OpenJ92/control-plane-kit-server-sdk/archive/e19b7ed205d492bdae3abe7c2449732bcc4d53dc.zip",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28",
  "uvicorn>=0.35",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_plane_kit_secrets = ["py.typed"]
